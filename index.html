<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administramos tus tareas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Contenedor principal de la tarjeta -->
    <div class="tarjeta">
        <h2>¿Que tarea deseas agregar?</h2>
        <!-- Caja de entrada para escribir la nueva tarea -->
        <div class="caja-entrada">
            <input type="text" id="taskInput" placeholder="escribe tu pendiente">
            <span>↵</span>
        </div>
        <!-- Contenedor donde se van a renderizar dinámicamente las tareas -->
        <div id="taskList" class="lista-tareas"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
